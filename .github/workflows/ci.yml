name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # pip aggiornato prima dell'audit: le versioni vecchie di pip stesso
        # compaiono tra i finding e farebbero fallire lo step.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Parse openapi.yaml
        # M5: sostituire con la verifica contratto <-> implementazione.
        run: python -c "import yaml; yaml.safe_load(open('openapi.yaml'))"
      - name: Audit dipendenze
        # --skip-editable: il pacchetto locale non è su PyPI e non è auditabile.
        # Esce comunque con errore se una dipendenza ha una CVE nota.
        run: pip-audit --skip-editable
