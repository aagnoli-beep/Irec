openapi: 3.1.0
info:
  title: IREC — API v1
  version: 1.0.0-draft.1
  description: |
    **BOZZA** — contratto di integrazione Mind → IREC, da concordare con il team Mind.
    Questo file è la fonte di verità dell'integrazione (contract-first).

    Convenzioni:
    - Autenticazione: call-token coniato da Mind (JWT firmato, verifica JWKS lato IREC).
      Claim richiesti: `sub`, `tenant_id`, `entitlement`, `scope`, `aud: "irec"`, `jti`, `exp`.
    - `x-correlation-id`: ricevuto da Mind e ri-emesso nei log di IREC.
    - Mutazioni idempotenti via header `Idempotency-Key`.
    - Run lunghe: risposta `202 { run_id }`, poi poll su GET.
    - Versioning `/v1`: solo cambi additivi; policy di deprecation da definire.
    - Gli endpoint a supporto dei tool dell'agente (addendum agentico §6:
      posizioni, storico solleciti, pausa/riprendi, ecc.) verranno aggiunti
      in modo additivo in revisioni successive di questa bozza.

servers:
  - url: /v1

security:
  - callToken: []

paths:
  # NON ANCORA IMPLEMENTATO: l'ingest diretto di dataset è previsto solo se
  # servirà accanto al recupero automatico dai microservizi (valutazione M8).
  /ingest:
    post:
      operationId: ingestDataset
      summary: Carica un dataset (fatture, incassi, pagamenti) per il tenant
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestRequest'
      responses:
        '202':
          description: Dataset accettato, elaborazione asincrona
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /reconciliations:
    post:
      operationId: startReconciliation
      summary: Avvia una run del ciclo di sincronizzazione e riconciliazione
      description: >-
        Verifica collegamenti (AdE, PSD2), recupera fatture e movimenti,
        riconcilia e applica gli esiti. Un retry con la stessa
        `Idempotency-Key` restituisce la stessa run, mai una seconda
        esecuzione.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Run accettata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunAccepted'
              example:
                run_id: "0f8a1c2d3e4b5a697887a6b5c4d3e2f1"
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '409':
          description: >-
            Una run QUEUED/RUNNING è già in corso per il tenant.
            `code`: run_in_progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /reconciliations/{run_id}:
    get:
      operationId: getReconciliation
      summary: Stato e risultato di una run del proprio tenant
      description: >-
        Un run_id di un altro tenant è indistinguibile da un id
        inesistente (404).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: run_id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Stato della run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationRun'
              example:
                run_id: "0f8a1c2d3e4b5a697887a6b5c4d3e2f1"
                status: completed
                error: null
                result:
                  collegamento_ade: attivo
                  consenso_psd2: attivo
                  fatture_recuperate: 4
                  fatture_importate: 4
                  clienti_creati: 2
                  comunicazioni_programmate: 36
                  movimenti_recuperati: 3
                  pagamenti_registrati: 3
                  fatture_saldate: 2
                  comunicazioni_annullate: 18
                  posizioni_chiuse: 1
                  anomalie: ["fattura_gia_scaduta:32-FA"]
                  pause_riprese: 0
                  escalation_eseguite: 0
                  escalation_imminenti: 1
                  messaggi_inviati: 2
                  comunicazioni_inviate: 3
                  comunicazioni_saltate: 0
                  comunicazioni_fallite: 0
                  segnalazioni: []
                  notifiche_generate: 1
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /invoices:
    get:
      operationId: listInvoices
      summary: Elenco fatture del tenant, filtrabile per stato
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: status
          in: query
          description: >-
            Stato operativo della fattura. `scaduta` non è uno stato
            persistito ma un filtro derivato (data_scadenza passata e
            fattura non ancora saldata).
          schema:
            type: string
            enum: [gestione, pausa, saldata, insoluto, scaduta]
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Fatture del tenant
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invoice'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /aging:
    get:
      operationId: getAging
      summary: Bucket di aging del credito (a_scadere, 0-30, 31-60, 61-90, 90+)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: as_of
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Aging del portafoglio del tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgingReport'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /tenant:
    delete:
      operationId: deleteTenant
      summary: Cancellazione GDPR dei dati del tenant del call-token
      description: >-
        Cancella tutti i dati del tenant identificato dal call-token.
        Non è possibile cancellare i dati di un altro tenant.
        Richiede lo scope `irec.tenant.delete` nel token firmato da Mind.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Dati del tenant cancellati
          content:
            application/json:
              schema:
                type: object
                properties:
                  tenant_cancellato: { type: boolean }
                  righe_cancellate:
                    type: object
                    additionalProperties: { type: integer }
              example:
                tenant_cancellato: true
                righe_cancellate: { fattura: 12, comunicazione: 34 }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /usage:
    get:
      operationId: getUsage
      summary: Consumo per il billing (aggregato da Mind)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Metriche di consumo del tenant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Usage'

  /portfolio:
    get:
      operationId: getPortfolio
      summary: KPI del portafoglio (affidato = recuperato + da recuperare + a recupero)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: KPI del tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Kpi' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /positions/{position_id}:
    get:
      operationId: getPosition
      summary: Dettaglio di una posizione con le sue fatture
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: position_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Posizione
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Position' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{invoice_id}/history:
    get:
      operationId: getInvoiceHistory
      summary: Cronologia delle comunicazioni di una fattura
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: invoice_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Storico comunicazioni
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Storico' }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{invoice_id}/next:
    get:
      operationId: getNextCommunications
      summary: Step programmati futuri di una fattura
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: invoice_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Prossimi invii
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProssimiInvii' }
        '404': { $ref: '#/components/responses/NotFound' }

  /communications/{communication_id}/explain:
    get:
      operationId: explainCommunication
      summary: Perché una comunicazione è (o non è) partita
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: communication_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Codice di spiegazione
          content:
            application/json:
              schema:
                type: object
                required: [comunicazione_id, codice]
                properties:
                  comunicazione_id: { type: string }
                  codice: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }

  /invoices/{invoice_id}/pause:
    post:
      operationId: pauseInvoice
      summary: Sospende il flusso su una fattura (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: invoice_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                fino_a: { type: [string, 'null'], format: date }
                motivo: { type: string }
      responses:
        '200':
          description: Nuovo stato della fattura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceState' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /invoices/{invoice_id}/resume:
    post:
      operationId: resumeInvoice
      summary: Riprende il flusso su una fattura in pausa (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: invoice_id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Nuovo stato della fattura
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoiceState' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /communications/{communication_id}/cancel:
    post:
      operationId: cancelCommunication
      summary: Annulla un singolo step programmato (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: communication_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /communications/{communication_id}/force:
    post:
      operationId: forceCommunication
      summary: Forza l'invio immediato di uno step (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: communication_id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /invoices/{invoice_id}/payments:
    post:
      operationId: registerPayment
      summary: Registra un pagamento manuale, idempotente (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - { name: invoice_id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [importo, data_pagamento]
              properties:
                importo: { type: string, format: decimal }
                data_pagamento: { type: string, format: date }
      responses:
        '200':
          description: Esito del pagamento
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PagamentoManuale' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /clients/{client_id}/contacts:
    patch:
      operationId: updateContacts
      summary: Aggiorna i recapiti di un cliente (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
        - { name: client_id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: [string, 'null'] }
                pec: { type: [string, 'null'] }
                telefono: { type: [string, 'null'] }
                canali_opt_out: { type: [array, 'null'], items: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '404': { $ref: '#/components/responses/NotFound' }

  /flow:
    put:
      operationId: replaceFlow
      summary: Sostituisce il flusso del mandante (Value/Premium, scope irec.write)
      description: >-
        La personalizzazione del flusso è disponibile dal pacchetto Value:
        un mandante Entry riceve 403 `upgrade_required` con invito garbato.
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  items:
                    type: object
                    required: [ordine, offset_giorni, canale, template]
                    properties:
                      ordine: { type: integer }
                      offset_giorni: { type: integer }
                      canale: { type: string, enum: [email, pec, whatsapp, voice] }
                      template: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Ok' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /report:
    post:
      operationId: sendReport
      summary: Genera e invia il report al mandante via email (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Esito dell'invio
          content:
            application/json:
              schema:
                type: object
                required: [inviato, destinatario_presente]
                properties:
                  inviato: { type: boolean }
                  destinatario_presente: { type: boolean }
        '403': { $ref: '#/components/responses/EntitlementError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }

  /brief:
    get:
      operationId: getBrief
      summary: Brief giornaliero — KPI + azioni proposte (max 3)
      description: >-
        Solo numeri e codici: il tono lo mette l'LLM di Mind (addendum §5.2).
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Brief del tenant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Brief' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /notifications:
    get:
      operationId: getNotifications
      summary: Notifiche proattive non lette (polling di Mind)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Notifiche in attesa
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Notifiche' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/EntitlementError' }

  /notifications/ack:
    post:
      operationId: ackNotifications
      summary: Conferma la ricezione delle notifiche (scope irec.write)
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: { type: array, items: { type: string } }
      responses:
        '200':
          description: Notifiche marcate come lette
          content:
            application/json:
              schema:
                type: object
                properties:
                  marcate: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: >-
            Autorizzazione insufficiente (`entitlement_missing`,
            `scope_missing`: l'ack è una mutazione e richiede `irec.write`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  # Gli endpoint operativi vivono alla root, fuori dal prefisso /v1
  # (server override per-path).
  /health:
    servers:
      - url: /
    get:
      operationId: health
      summary: Liveness
      security: []
      responses:
        '200':
          description: Servizio vivo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ok }

  /ready:
    servers:
      - url: /
    get:
      operationId: ready
      summary: Readiness (verifier dei call-token e database)
      security: []
      responses:
        '200':
          description: Servizio pronto
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
        '503':
          description: Dipendenze non pronte
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: not_ready }
                  reason: { type: string }

components:
  securitySchemes:
    callToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Call-token coniato da Mind, verificato da IREC via JWKS.

  parameters:
    CorrelationId:
      name: x-correlation-id
      in: header
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }

  responses:
    BadRequest:
      description: >-
        Richiesta non valida. `code`: validation_error,
        missing_idempotency_key, invalid_idempotency_key (oltre 128 caratteri),
        invalid_amount, invalid_channel, invalid_status, empty_flow,
        duplicate_step_order.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: >-
        Call-token assente o non valido. `code`: missing_token, invalid_token,
        token_expired, invalid_audience, unknown_key, missing_tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServiceUnavailable:
      description: >-
        Dipendenza non disponibile. `code`: auth_not_configured,
        jwks_unavailable, database_not_configured, database_unreachable,
        providers_not_configured.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    EntitlementError:
      description: >-
        Autorizzazione insufficiente. `code`: entitlement_missing (nessun
        entitlement IREC), scope_missing (scope richiesto assente dal token),
        upgrade_required (funzione non nel pacchetto del mandante).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Risorsa non trovata
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: >-
        Stato incompatibile con l'azione. `code`: invoice_not_pausable,
        invoice_not_paused, invoice_not_active, invoice_already_paid,
        invoice_in_recovery, communication_not_cancellable,
        communication_not_forceable, channel_unavailable, run_in_progress.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Ok:
      description: Operazione eseguita
      content:
        application/json:
          schema:
            type: object
            properties:
              ok: { type: boolean }

  schemas:
    Error:
      type: object
      required: [error, code]
      properties:
        error: { type: string }
        code: { type: string }

    Kpi:
      type: object
      required: [affidato, recuperato, da_recuperare, passato_a_recupero]
      properties:
        affidato: { type: string, format: decimal }
        recuperato: { type: string, format: decimal }
        da_recuperare: { type: string, format: decimal }
        passato_a_recupero: { type: string, format: decimal }
        fatture_per_stato: { type: object, additionalProperties: { type: integer } }
        posizioni_aperte: { type: integer }
        posizioni_chiuse: { type: integer }

    Position:
      type: object
      properties:
        id: { type: string }
        cliente: { type: string }
        piva_cf: { type: string }
        stato: { type: string }
        importo_totale_residuo: { type: string, format: decimal }
        fatture:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }

    Comunicazione:
      type: object
      properties:
        id: { type: string }
        canale: { type: string }
        template: { type: string }
        stato:
          type: string
          enum: [programmata, inviata, annullata, fallita, saltata]
        programmata_per: { type: string, format: date-time }
        inviata_at: { type: [string, 'null'], format: date-time }
        esito_recapito: { type: [string, 'null'] }

    Storico:
      type: object
      properties:
        fattura_id: { type: string }
        comunicazioni:
          type: array
          items: { $ref: '#/components/schemas/Comunicazione' }

    ProssimiInvii:
      type: object
      properties:
        fattura_id: { type: string }
        prossimi:
          type: array
          items: { $ref: '#/components/schemas/Comunicazione' }

    InvoiceState:
      type: object
      required: [id, stato]
      properties:
        id: { type: string }
        stato: { type: string }

    PagamentoManuale:
      type: object
      required: [fattura_id, stato, gia_registrato, comunicazioni_annullate]
      properties:
        fattura_id: { type: string }
        stato: { type: string }
        gia_registrato: { type: boolean }
        comunicazioni_annullate: { type: integer }

    Brief:
      type: object
      required: [affidato, recuperato, da_recuperare, passato_a_recupero]
      properties:
        affidato: { type: string, format: decimal }
        recuperato: { type: string, format: decimal }
        da_recuperare: { type: string, format: decimal }
        passato_a_recupero: { type: string, format: decimal }
        percentuale_recuperato: { type: integer }
        azioni_principali:
          type: array
          items:
            type: object
            properties:
              tipo:
                type: string
                enum: [escalation_imminente, consenso_psd2, collegamento_ade, escalation_eseguita, dato_in_ritardo]
              quante: { type: integer }
        altre_azioni: { type: integer }

    Notifiche:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, tipo, riferimento, created_at]
            properties:
              id: { type: string }
              tipo:
                type: string
                enum: [escalation_imminente, consenso_psd2, collegamento_ade, escalation_eseguita, dato_in_ritardo]
              riferimento: { type: string }
              dettaglio: { type: [string, 'null'] }
              created_at: { type: string, format: date-time }

    RunAccepted:
      type: object
      required: [run_id]
      properties:
        run_id: { type: string }

    IngestRequest:
      type: object
      description: >-
        Struttura provvisoria — dipende dai contratti dei microservizi esterni
        (fatture XML AdE, movimenti formato API banca).
      properties:
        kind:
          type: string
          enum: [invoices, movements, payments]
        payload:
          type: object

    ReconciliationRun:
      type: object
      required: [run_id, status]
      properties:
        run_id: { type: string }
        status:
          type: string
          enum: [queued, running, completed, failed]
        error:
          type: [string, 'null']
          description: Tipo dell'errore (mai dettagli interni), solo per status=failed.
        result:
          type: [object, 'null']
          description: >-
            Riepilogo della run: conteggi, stati dei collegamenti e codici
            anomalia (`mandante_non_censito`, `fattura_gia_scaduta:<numero>`,
            `pagamento_senza_fattura:<id_movimento>`). Nessun dato personale.
          properties:
            collegamento_ade: { type: string }
            consenso_psd2: { type: string }
            fatture_recuperate: { type: integer }
            fatture_importate: { type: integer }
            clienti_creati: { type: integer }
            comunicazioni_programmate: { type: integer }
            movimenti_recuperati: { type: integer }
            pagamenti_registrati: { type: integer }
            fatture_saldate: { type: integer }
            comunicazioni_annullate: { type: integer }
            posizioni_chiuse: { type: integer }
            anomalie:
              type: array
              items: { type: string }
            pause_riprese: { type: integer }
            escalation_eseguite: { type: integer }
            escalation_imminenti: { type: integer }
            messaggi_inviati: { type: integer }
            comunicazioni_inviate: { type: integer }
            comunicazioni_saltate: { type: integer }
            comunicazioni_fallite: { type: integer }
            segnalazioni:
              type: array
              description: >-
                Codici operativi della fase invii (es.
                `opt_out:email:<fattura_id>`, `invio_fallito:pec:<fattura_id>`,
                `escalation_senza_mail_mandante:<fattura_id>`). Riferimenti
                per id opaco, nessun numero fattura o importo.
              items: { type: string }
            notifiche_generate: { type: integer }

    Invoice:
      type: object
      properties:
        id: { type: string }
        numero: { type: string }
        cliente: { type: string }
        piva_cf: { type: string }
        data_emissione: { type: string, format: date }
        data_scadenza: { type: string, format: date }
        # Gli importi viaggiano come stringhe decimali: il dominio è
        # finanziario e un double introdurrebbe errori sui centesimi.
        importo: { type: string, format: decimal, examples: ['1220.00'] }
        importo_residuo: { type: string, format: decimal, examples: ['0.00'] }
        stato:
          type: string
          enum: [gestione, pausa, saldata, insoluto]

    AgingReport:
      type: object
      properties:
        as_of: { type: string, format: date }
        buckets:
          type: array
          items:
            type: object
            properties:
              label: { type: string, examples: ['a_scadere', '0-30', '31-60', '61-90', '90+'] }
              importo: { type: string, format: decimal }
              numero_fatture: { type: integer }

    Usage:
      type: object
      properties:
        tenant_id: { type: string }
        period_from: { type: string, format: date }
        period_to: { type: string, format: date }
        metrics:
          type: object
          additionalProperties: { type: number }
